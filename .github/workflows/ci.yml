name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prettier --check src tests examples

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage
        if: matrix.node == '24'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  workers-compat:
    name: Cloudflare Workers compat
    runs-on: ubuntu-latest
    # @cloudflare/vitest-pool-workers has no vitest 5 release yet (latest peers vitest ^4.1), so this job cannot pass.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      # The Workers pool isn't a runtime/dev dep — installed only in CI
      # so a missing local install doesn't block contributors.
      - run: npm install --no-save @cloudflare/vitest-pool-workers
      - run: npm run test:workers

  build:
    name: Build + size
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run size
      - name: Smoke-test the built bundles
        run: |
          node -e "const m = require('./dist/index.cjs'); if (!m.ClarisMD) { console.error('CJS export missing'); process.exit(1); } console.log('CJS ok, VERSION =', m.VERSION);"
          node --input-type=module -e "import('./dist/index.mjs').then(m => { if (!m.ClarisMD) { console.error('ESM export missing'); process.exit(1); } console.log('ESM ok, VERSION =', m.VERSION); });"
