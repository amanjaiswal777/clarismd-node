name: Bug report
description: Report unexpected behavior in the ClarisMD Node SDK.
title: "[bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. **Please redact any real PHI / PII**
        from logs, error messages, and code snippets before pasting them.
        Use synthetic data for repros (e.g., `John Doe`, `MRN 0000`).

        For security vulnerabilities, follow [SECURITY.md](../SECURITY.md)
        instead — do not open a public issue.

  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: Output of `npm list @clarismd/sdk` or `cat node_modules/@clarismd/sdk/package.json | grep version`.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: "v20.10.0"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js
        - Cloudflare Workers
        - Deno
        - Bun
        - Browser
        - Other (please specify in description)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. Include the **request_id** from `error.requestId` if available — it lets us correlate against gateway logs.
      placeholder: |
        I called `client.chat.completions.create({...})` and got a
        `TypeError: ...` instead of the expected response.

        request_id: req_abc123
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal code that reproduces the issue. Use synthetic data only.
      render: typescript
      placeholder: |
        import { ClarisMD } from "@clarismd/sdk";
        const client = new ClarisMD({ apiKey: "sk-..." });
        await client.chat.completions.create({
          model: "gpt-4o-mini",
          messages: [{ role: "user", content: "test" }],
        });
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Stack traces, screenshots, or other relevant info.
